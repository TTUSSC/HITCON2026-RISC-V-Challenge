# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
        # The rv32emu WASM build (frontend/public/rv32emu.wasm, ~7MB) is a
        # required production asset, not an accidental large-file commit —
        # the RISC-V judge engine can't run without it. Default 500KB limit
        # doesn't fit that; raise it instead of bypassing the hook.
        args: ['--maxkb=8000']
    -   id: check-merge-conflict
    -   id: mixed-line-ending
-   repo: local
    hooks:
    -   id: frontend-eslint
        name: frontend eslint
        entry: pnpm --dir frontend run lint
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
    -   id: frontend-format
        name: frontend prettier
        entry: pnpm --dir frontend run format
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|css|json)$
        pass_filenames: false
    -   id: frontend-test
        name: frontend tests
        entry: pnpm --dir frontend run test
        language: system
        # Scoped to the LEVEL_ORDER drift guard's own inputs, not all of
        # frontend/src: the backend is Python now and can't import a .ts
        # module to compare against the frontend's canonical `levels`
        # directly, so frontend/src/engine/levels.drift.test.ts parses
        # backend/src/shared/levels.py as text instead (see that test file
        # and docs/superpowers/specs/2026-08-21-leaderboard-backend-design.md
        # §6). Either copy changing — or the guard itself — needs this to run.
        files: ^(frontend/src/engine/levels\.ts|frontend/src/engine/levels\.drift\.test\.ts|backend/src/shared/levels\.py)$
        pass_filenames: false
    -   id: backend-test
        name: backend tests
        entry: backend/.venv/bin/pytest -q -c backend/pyproject.toml
        language: system
        # The old `pnpm --dir backend run test` (vitest) is gone along with
        # the rest of the TypeScript backend; this is now a pure-Python
        # project. No longer matches frontend/src/engine/levels.ts -- the
        # drift guard that used to justify that cross-reference lives in the
        # frontend now (see the frontend-test hook above).
        files: ^backend/.*\.py$
        pass_filenames: false
