# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
        # The rv32emu WASM build (frontend/public/rv32emu.wasm, ~7MB) is a
        # required production asset, not an accidental large-file commit —
        # the RISC-V judge engine can't run without it. Default 500KB limit
        # doesn't fit that; raise it instead of bypassing the hook.
        args: ['--maxkb=8000']
    -   id: check-merge-conflict
    -   id: mixed-line-ending
-   repo: local
    hooks:
    -   id: frontend-eslint
        name: frontend eslint
        entry: pnpm --dir frontend run lint
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
    -   id: frontend-format
        name: frontend prettier
        entry: pnpm --dir frontend run format
        language: system
        files: ^frontend/.*\.(js|jsx|ts|tsx|css|json)$
        pass_filenames: false
    -   id: backend-test
        name: backend tests
        entry: pnpm --dir backend run test
        language: system
        # Also runs when the frontend's level list changes: the drift guard in
        # backend/test/shared/levelOrder.drift.test.ts is what catches someone
        # adding a level without updating the backend's LEVEL_ORDER.
        files: ^(backend/.*\.ts|frontend/src/engine/levels\.ts)$
        pass_filenames: false
